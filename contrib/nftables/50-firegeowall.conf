# firegeowall: hook chain (yours) and the chain fgw owns (its).
# Adjust "ens6" to your public interface. fgw never edits this file.

table inet filter {
    # Owned by the operator. fgw only checks that it exists and jumps to geo_block.
    chain geo_prerouting {
        type filter hook prerouting priority -150; policy accept;
        iifname != "ens6" return
        ct state established,related return
        jump geo_block
    }

    # Owned by fgw. Declared empty here so the jump above is valid before the
    # first run. fgw fills it with one "ip saddr @geo_<cc> counter drop" rule per
    # country and family, and creates the sets geo_<cc> / geo6_<cc> itself.
    chain geo_block {
    }
}
