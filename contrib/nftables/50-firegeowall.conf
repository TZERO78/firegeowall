# firegeowall: country block sets and the one chain that uses them.
# firegeowall only fills the sets. Edit this file, not the tool, to change behaviour.
# Adjust "ens6" to your public interface.

table inet filter {
    set geo_block {
        type ipv4_addr
        flags interval
        auto-merge
    }
    set geo_block6 {
        type ipv6_addr
        flags interval
        auto-merge
    }

    chain geo_prerouting {
        type filter hook prerouting priority -150; policy accept;
        iifname != "ens6" return
        ct state established,related return
        ip  saddr @geo_block  counter drop
        ip6 saddr @geo_block6 counter drop
    }
}
