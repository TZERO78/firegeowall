[package]
name = "firegeowall"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Block countries on the public interface with nftables sets"
repository = "https://github.com/TZERO78/firegeowall"
readme = "README.md"
publish = false

[[bin]]
name = "fgw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = "3"

[package.metadata.deb]
name = "firegeowall"
maintainer = "TZERO78 <68284646+TZERO78@users.noreply.github.com>"
copyright = "TZERO78"
extended-description = """\
fgw keeps one nftables set per blocked country filled with that country's IP \
ranges (IPv4 and IPv6) and maintains one counted drop rule per country in a \
chain it owns. Block list only, fail open, atomic updates, boot restore from \
a local cache. Nothing is enabled on install; see README.Debian."""
section = "net"
priority = "optional"
depends = "nftables, systemd"
maintainer-scripts = "contrib/deb/"
assets = [
    ["target/release/fgw", "usr/sbin/fgw", "755"],
    ["contrib/systemd/fgw-restore.service", "usr/lib/systemd/system/", "644"],
    ["contrib/systemd/fgw-update.service", "usr/lib/systemd/system/", "644"],
    ["contrib/systemd/fgw-update.timer", "usr/lib/systemd/system/", "644"],
    ["contrib/systemd/sysusers-fgw.conf", "usr/lib/sysusers.d/fgw.conf", "644"],
    ["contrib/deb/config.yml", "usr/share/firegeowall/config.yml", "644"],
    ["contrib/deb/README.Debian", "usr/share/doc/firegeowall/README.Debian", "644"],
    ["README.md", "usr/share/doc/firegeowall/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/firegeowall/CHANGELOG.md", "644"],
    ["docs/DESIGN.md", "usr/share/doc/firegeowall/DESIGN.md", "644"],
    ["contrib/config.yml", "usr/share/doc/firegeowall/examples/config.yml", "644"],
    ["contrib/nftables/50-firegeowall.conf", "usr/share/doc/firegeowall/examples/50-firegeowall.conf", "644"],
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
